<h1>芯片寄存器调试工具</h1>
<p class="tool-desc">寄存器读写与步进测试工具，支持标志位设置和串口输出解析。</p>
<div class="tool-card"><h2>寄存器操作</h2><div class="tool-grid"><div><label>寄存器地址 (Hex)</label><input type="text" value="0x40021000"/></div><div><label>值 (Hex)</label><input type="text" value="0x000000FF"/></div></div><div style="display:flex;gap:10px"><button onclick='alert("演示版：读取寄存器")'>读取</button><button onclick='alert("演示版：写入寄存器")'>写入</button></div><div class="output-area">寄存器 0x40021000 = 0x000000A5</div></div>
<div class="tool-card"><h2>步进测试</h2><label>测试序列</label><textarea>1, 0x40021000, 0x01, PWR_ON&#10;2, 0x40021004, 0x80, CLK_EN&#10;3, 0x40021008, 0xFF, DATA_RDY</textarea><button onclick="alert('演示版：执行 3 步骤进测试')">执行步进测试</button><div class="output-area">状态: READY | 共 3 步 | 上次测试: PASS</div></div>
