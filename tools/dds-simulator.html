<h1>DDS 信号录制回放模拟器</h1>
<p class="tool-desc">模拟 DDS 汽车信号录制与回放，支持自定义信号、回放次数与实时进度显示。</p>
<div class="tool-card"><h2>信号录制</h2><div class="tool-grid"><div><label>信号主题 (Topic)</label><input type="text" value="/vehicle/speed"/></div><div><label>录制时长 (秒)</label><input type="number" value="30"/></div></div><button onclick="alert('演示版：开始录制 /vehicle/speed')">开始录制</button><div class="output-area">等待录制…</div></div>
<div class="tool-card"><h2>信号回放</h2><label>选择录制文件</label><select><option>recording_20260727_001.dds</option><option>recording_20260726_005.dds</option><option>recording_20260725_012.dds</option></select><div class="tool-grid"><div><label>回放次数</label><input type="number" value="3"/></div><div><label>回放速度</label><select><option>0.5x</option><option selected>1.0x</option><option>2.0x</option></select></div></div><button onclick='alert("演示版：开始回放 " + document.querySelector("select").value)'>开始回放</button></div>
